name: Bug report
description: Something doesn't work the way you expect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't attach screenshots or guides that show private or confidential information.**
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown at edge://extensions
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Microsoft Edge 142 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it only happens on one website, say which kind of site (public site name is fine; no internal URLs).
      placeholder: |
        1. Start recording on ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Errors (optional)
      description: "From edge://extensions > Step Recorder > Service worker (Inspect views) > Console."
      render: text
