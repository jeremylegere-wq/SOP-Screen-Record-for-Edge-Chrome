name: Release

# Pushing a tag like v1.2.0 runs the full CI, builds the extension zip and creates a DRAFT GitHub Release.
# Nothing is published to any store. You review the draft and click "Publish release" yourself.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (same checks as CI)
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and create draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the only job that can write, and only to create the release for this tag
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point at a commit on the default branch
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $TAG is not on $DEFAULT_BRANCH. Merge your changes first, then tag the merged commit."
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Tag matches the version in manifest.json, and CHANGELOG has notes
        run: node scripts/check-release.mjs "$TAG" --notes dist/release-notes.md

      - name: Build extension package
        run: npm run build

      - name: Checksum file matches the zip
        working-directory: dist
        run: sha256sum --check --strict ./*.sha256

      - name: Download the package built by CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-package
          path: ci-dist

      - name: Release build is identical to the CI build
        run: |
          for f in dist/*.sha256; do
            diff "$f" "ci-dist/$(basename "$f")" || { echo "::error::Release build differs from the CI build of the same commit."; exit 1; }
          done

      - name: Create draft GitHub Release
        run: |
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --draft \
            --verify-tag \
            --title "Step Recorder $TAG" \
            --notes-file dist/release-notes.md
          {
            echo "### Draft release $TAG created"
            echo "Review it under Releases, then click **Publish release**."
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
