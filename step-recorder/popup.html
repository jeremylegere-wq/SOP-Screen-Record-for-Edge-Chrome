<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Step Recorder</title>
  <style>
    :root { --accent:#0f6cbd; --rec:#d92d20; --border:#e0e0e0; --muted:#616161; }
    * { box-sizing:border-box; }
    body { margin:0; width:280px; padding:16px; font:14px/1.4 "Segoe UI",system-ui,sans-serif; color:#242424; background:#fff; }
    header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    h1 { font-size:16px; margin:0; font-weight:600; }
    .dot { width:10px; height:10px; border-radius:50%; background:#bdbdbd; }
    .dot.rec { background:var(--rec); animation:pulse 1.2s infinite; }
    .dot.paused { background:#f7a600; }
    @keyframes pulse { 50% { opacity:.35; } }
    #status { margin:0 0 14px; color:var(--muted); font-size:13px; }
    .stack { display:flex; flex-direction:column; gap:8px; }
    .row { display:flex; gap:8px; }
    button { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:#fafafa; cursor:pointer; flex:1; }
    button:hover { background:#f0f0f0; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button.primary:hover { background:#115ea3; }
    button.danger { background:var(--rec); border-color:var(--rec); color:#fff; font-weight:600; }
    button.danger:hover { background:#b42318; }
    button.link { border:none; background:none; color:var(--accent); padding:4px; flex:none; align-self:flex-start; }
    [hidden] { display:none !important; }
    .hint { font-size:12px; color:var(--muted); margin:12px 0 0; }
  </style>
</head>
<body>
  <header><span id="dot" class="dot"></span><h1>Step Recorder</h1></header>
  <p id="status">Not recording</p>

  <div id="idle" class="stack">
    <button id="start" class="primary">Start recording</button>
    <button id="open">Open last guide</button>
  </div>

  <div id="live" class="stack" hidden>
    <button id="stop" class="danger">Stop &amp; view guide</button>
    <div class="row">
      <button id="pause">Pause</button>
      <button id="discard">Discard</button>
    </div>
  </div>

  <p class="hint">Clicks, typing and dropdown changes are captured with a screenshot. Edge's own pages (edge://) can't be recorded.</p>
  <script src="popup.js"></script>
</body>
</html>
