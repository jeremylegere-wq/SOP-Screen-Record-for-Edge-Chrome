<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step Recorder - Guide</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="toolbar">
    <input id="guideTitle" class="guide-title" type="text" placeholder="Guide title" aria-label="Guide title">
    <span id="count" class="count"></span>
    <div class="actions">
      <button data-action="export-html" class="primary">Export HTML</button>
      <button data-action="print">Print / PDF</button>
      <button data-action="copy-text">Copy as text</button>
      <button data-action="export-json">JSON</button>
      <button data-action="clear" class="danger-text">Clear</button>
    </div>
  </header>
  <main id="steps" class="wrap"></main>
  <script src="viewer.js"></script>
</body>
</html>
